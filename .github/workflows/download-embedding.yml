
name: Download Qwen3 Embedding ONNX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade huggingface_hub

      - name: Download exact Cherry Studio model file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models

          hf download \
            onnx-community/Qwen3-Embedding-0.6B-ONNX \
            onnx/model_quantized.onnx \
            --local-dir models

          test -s models/onnx/model_quantized.onnx

          cp models/onnx/model_quantized.onnx \
            models/model_quantized.onnx

          cd models
          sha256sum model_quantized.onnx > SHA256SUMS
          ls -lh model_quantized.onnx SHA256SUMS

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="qwen3-embedding-onnx"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Qwen3 Embedding 0.6B ONNX" \
              --notes "ONNX model file for Cherry Studio."
          fi

          gh release upload "$TAG" \
            models/model_quantized.onnx \
            models/SHA256SUMS \
            --clobber

          gh release view "$TAG" --json url --jq '.url'
